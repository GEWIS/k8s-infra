apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-prune
  namespace: postgres
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup-prune
  namespace: postgres
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-prune
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-backup-prune
subjects:
  - kind: ServiceAccount
    name: postgres-backup-prune
    namespace: postgres
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-prune
  namespace: postgres
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: postgres-backup-prune
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: prune
              image: docker.io/alpine/kubectl:1.37.1
              env:
                - name: KEEP
                  value: "30"
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -euc
                - |
                  names=$(kubectl get volumesnapshot -n postgres \
                    --sort-by=.metadata.creationTimestamp \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
                  drop=$(($(printf '%s\n' "$names" | sed '/^$/d' | wc -l) - KEEP))
                  [ "$drop" -gt 0 ] || exit 0
                  printf '%s\n' "$names" | sed -n "1,${drop}p" | while read -r name; do
                    kubectl delete backup.postgresql.cnpg.io -n postgres "$name" --ignore-not-found
                    kubectl delete volumesnapshot -n postgres "$name" --ignore-not-found
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
