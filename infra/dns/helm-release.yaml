apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: flux-system
spec:
  targetNamespace: coredns
  storageNamespace: coredns
  chart:
    spec:
      chart: coredns
      version: "1.46.0"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: coredns
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    isClusterService: false
    serviceType: LoadBalancer
    servers:
    - zones:
      - zone: .
      plugins:
      - name: forward
        parameters: . 1.1.1.1 1.0.0.1
        configBlock: |-
          policy sequential
