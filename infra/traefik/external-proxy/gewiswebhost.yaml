apiVersion: v1
kind: Service
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  type: ExternalName
  externalName: webhost.localnet.gewis.nl
  ports:
    - name: https
      port: 443
      protocol: TCP
    - name: mgmt
      port: 10002
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  insecureSkipVerify: true
---
# Used by the gewis.nl/corporateidentity route in gewis.yaml
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: stijl-gewis-nl-transport
  namespace: external-proxy
spec:
  serverName: stijl.gewis.nl
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: >-
        Host(`personal.gewis.nl`) ||
        Host(`mta-sts.gewis.nl`) ||
        Host(`webhost-auth.gewis.nl`) ||
        Host(`vz.personal.gewis.nl`) ||
        Host(`signature.gewis.nl`) ||
        Host(`secr.personal.gewis.nl`) ||
        Host(`rink.personal.gewis.nl`) ||
        Host(`pm.personal.gewis.nl`) ||
        Host(`fse.gewis.nl`) ||
        Host(`co.personal.gewis.nl`) ||
        Host(`cib.personal.gewis.nl`) ||
        Host(`cbc.gewis.nl`) ||
        Host(`board.gewis.nl`) ||
        Host(`infoscherm.gewis.nl`) ||
        Host(`ceb.personal.gewis.nl`) ||
        Host(`femke.personal.gewis.nl`) ||
        Host(`9eglinster.gewis.nl`) ||
        Host(`geglinster.gewis.nl`) ||
        Host(`boom.gewis.nl`) ||
        Host(`athena.gewis.nl`) ||
        Host(`avico.gewis.nl`) ||
        Host(`bac.gewis.nl`) ||
        Host(`defi.gewis.nl`) ||
        Host(`gehack.gewis.nl`) ||
        Host(`gezwem.gewis.nl`) ||
        Host(`inf.gewis.nl`) ||
        Host(`info.gewis.nl`) ||
        Host(`intro.gewis.nl`) ||
        Host(`intro25.gewis.nl`) ||
        Host(`linkinbio.gewis.nl`) ||
        Host(`odc.gewis.nl`) ||
        Host(`static.gewis.nl`) ||
        Host(`ssg.gewis.nl`) ||
        Host(`stijl.gewis.nl`)
      services:
        - name: gewiswebhost
          port: 443
          scheme: https
          passHostHeader: true
          serversTransport: gewiswebhost
---
# webhost-mgmt.gewis.nl — webhost admin interface (Webmin on port 10002).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewiswebhost-mgmt
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`webhost-mgmt.gewis.nl`)
      services:
        - name: gewiswebhost
          port: 10002
          scheme: http
          passHostHeader: false
