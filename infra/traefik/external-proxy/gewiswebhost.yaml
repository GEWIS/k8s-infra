apiVersion: v1
kind: Service
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  type: ExternalName
  externalName: webhost.localnet.gewis.nl
  ports:
    - name: https
      port: 443
      protocol: TCP
    - name: mgmt
      port: 10002
      protocol: TCP
---
# Used by the gewis.nl/corporateidentity route in gewis.yaml.
# That route rewrites Host to stijl.gewis.nl, so SNI must match too (see below).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: stijl-gewis-nl-transport
  namespace: external-proxy
spec:
  serverName: stijl.gewis.nl
  insecureSkipVerify: true
---
# Raw TLS passthrough for the webhost-served sites.
#
# The webhost (openresty) enforces SNI == Host and returns 421 Misdirected
# Request otherwise. When Traefik terminates and re-encrypts, its outbound SNI
# is fixed to the ExternalName (webhost.localnet.gewis.nl) and can't match each
# per-request Host, so every site 421'd. Passthrough forwards the browser's
# original TLS untouched, so the webhost sees SNI == Host and serves its own
# per-domain certs.
#
# Each host MUST be listed explicitly. A wildcard HostSNI would hijack every
# Traefik-terminated router (dashboard + apps). Add one HostSNI per new site.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        HostSNI(`personal.gewis.nl`) ||
        HostSNI(`mta-sts.gewis.nl`) ||
        HostSNI(`webhost-auth.gewis.nl`) ||
        HostSNI(`vz.personal.gewis.nl`) ||
        HostSNI(`signature.gewis.nl`) ||
        HostSNI(`secr.personal.gewis.nl`) ||
        HostSNI(`rink.personal.gewis.nl`) ||
        HostSNI(`pm.personal.gewis.nl`) ||
        HostSNI(`fse.gewis.nl`) ||
        HostSNI(`co.personal.gewis.nl`) ||
        HostSNI(`cib.personal.gewis.nl`) ||
        HostSNI(`cbc.gewis.nl`) ||
        HostSNI(`board.gewis.nl`) ||
        HostSNI(`infoscherm.gewis.nl`) ||
        HostSNI(`ceb.personal.gewis.nl`) ||
        HostSNI(`femke.personal.gewis.nl`) ||
        HostSNI(`9eglinster.gewis.nl`) ||
        HostSNI(`geglinster.gewis.nl`) ||
        HostSNI(`boom.gewis.nl`) ||
        HostSNI(`athena.gewis.nl`) ||
        HostSNI(`avico.gewis.nl`) ||
        HostSNI(`bac.gewis.nl`) ||
        HostSNI(`defi.gewis.nl`) ||
        HostSNI(`gehack.gewis.nl`) ||
        HostSNI(`gezwem.gewis.nl`) ||
        HostSNI(`inf.gewis.nl`) ||
        HostSNI(`info.gewis.nl`) ||
        HostSNI(`intro.gewis.nl`) ||
        HostSNI(`intro25.gewis.nl`) ||
        HostSNI(`linkinbio.gewis.nl`) ||
        HostSNI(`odc.gewis.nl`) ||
        HostSNI(`static.gewis.nl`) ||
        HostSNI(`ssg.gewis.nl`) ||
        HostSNI(`stijl.gewis.nl`)
      services:
        - name: gewiswebhost
          port: 443
  tls:
    passthrough: true
---
# webhost-mgmt.gewis.nl — webhost admin interface (Webmin on port 10002).
# Plain HTTP backend, so this stays Traefik-terminated (no SNI mismatch).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gewiswebhost-mgmt
  namespace: external-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`webhost-mgmt.gewis.nl`)
      services:
        - name: gewiswebhost
          port: 10002
          scheme: http
          passHostHeader: false
