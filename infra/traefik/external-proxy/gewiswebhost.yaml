apiVersion: v1
kind: Service
metadata:
  name: gewiswebhost
  namespace: external-proxy
spec:
  type: ExternalName
  externalName: webhost.localnet.gewis.nl
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: cbc-gewis-nl-transport
  namespace: external-proxy
spec:
  serverName: cbc.gewis.nl
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: stijl-gewis-nl-transport
  namespace: external-proxy
spec:
  serverName: stijl.gewis.nl
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbc-gewis-nl
  namespace: external-proxy
spec:
  routes:
    - kind: Rule
      match: Host(`cbc.gewis.nl`)
      services:
        - name: gewiswebhost
          port: 443
          scheme: https
          serversTransport: cbc-gewis-nl-transport
