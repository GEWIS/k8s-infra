---
# Global gate: every HTTP request on websecure without the gate cookie is
# redirected away. The gate router outranks every other HTTP router through its
# explicit priority (all other routers fall back to rule-length priorities,
# which are orders of magnitude smaller). The enter/leave routers outrank the
# gate itself so they stay reachable while the gate is closed.
#
# noop@internal is Traefik's built-in dead-end service: the redirect middlewares
# always terminate the request, so no backend is ever reached.
#
# The gate is currently scoped to PathPrefix(`/__gatetest`) so it affects
# nothing real. Drop that clause from the gate rule to go live.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-redirect
  namespace: traefik
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://cbc-bbq.gewis.nl"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-redirect-root
  namespace: traefik
spec:
  redirectRegex:
    regex: "^(https?://[^/]+)/.*"
    replacement: "${1}/"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-cookie-set
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Set-Cookie: "gewis-gate=open; Path=/; Domain=gewis.nl; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-cookie-clear
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Set-Cookie: "gewis-gate=; Path=/; Domain=gewis.nl; Max-Age=0; Secure; HttpOnly; SameSite=Lax"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gate
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: '!HeaderRegexp(`Cookie`, `(^|;\s*)gewis-gate=open(;|$)`) && !Host(`cbc-bbq.gewis.nl`) && !Host(`restreamer.gewis.nl`)'
      priority: 2000000
      middlewares:
        - name: gate-redirect
      services:
        - kind: TraefikService
          name: noop@internal
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gate-enter
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Path(`/__gate/enter`)
      priority: 2000001
      middlewares:
        - name: gate-cookie-set
        - name: gate-redirect-root
      services:
        - kind: TraefikService
          name: noop@internal
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gate-leave
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Path(`/__gate/leave`)
      priority: 2000001
      middlewares:
        - name: gate-cookie-clear
        - name: gate-redirect
      services:
        - kind: TraefikService
          name: noop@internal
